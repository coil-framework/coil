[package]
name = "coil-core"
version = "0.1.0"
edition = "2024"

rust-version = "1.85"
license = "MIT"
repository = "https://github.com/coil-framework/coil"
homepage = "https://coil-framework.github.io/coil/"
documentation = "https://coil-framework.github.io/coil/"
description = "Core runtime contracts and composition primitives for the Coil framework."
[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
coil-a11y = { version = "0.1.0", path = "../coil-a11y" }
coil-auth = { version = "0.1.0", path = "../coil-auth" }
coil-cache = { version = "0.1.0", path = "../coil-cache" }
coil-config = { version = "0.1.0", path = "../coil-config" }
coil-data = { version = "0.1.0", path = "../coil-data" }
coil-i18n = { version = "0.1.0", path = "../coil-i18n" }
coil-jobs = { version = "0.1.0", path = "../coil-jobs" }
coil-observability = { version = "0.1.0", path = "../coil-observability" }
coil-seo = { version = "0.1.0", path = "../coil-seo" }
coil-template = { version = "0.1.0", path = "../coil-template" }
coil-tls = { version = "0.1.0", path = "../coil-tls" }
coil-wasm = { version = "0.1.0", path = "../coil-wasm" }
hmac = "0.12"
rand = "0.8"
sha2 = "0.10"
thiserror = "1.0"
toml = "0.8"
