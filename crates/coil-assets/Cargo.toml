[package]
name = "coil-assets"
version = "0.1.1"
edition = "2024"

rust-version = "1.85"
license = "MIT"
repository = "https://github.com/coil-framework/coil"
homepage = "https://coil.rs"
documentation = "https://coil.rs/docs"
description = "Asset publishing and delivery primitives for the Coil framework."
readme = "README.md"
[dependencies]
coil-auth = { version = "0.1.1", path = "../coil-auth" }
coil-storage = { version = "0.1.1", path = "../coil-storage" }
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
coil-config = { version = "0.1.1", path = "../coil-config" }
tempfile = "3"
