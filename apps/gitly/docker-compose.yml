services:
  app:
    build:
      context: ../..
      dockerfile: apps/gitly/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      COIL_CONFIG: platform.dev.toml
      DATABASE_URL: postgres://coil:devpass@postgres:5432/coil_gitly
      REDIS_URL: redis://redis:6379
      COIL_COOKIE_SECRET: "01234567012345670123456701234567"
      COIL_CSRF_SECRET: "76543210765432107654321076543210"
      OBJECT_STORE_URL: |-
        endpoint_url="http://minio:9000"
        bucket="gitly"
        region="us-east-1"
        access_key_id="minio"
        secret_access_key="minio123"
    ports:
      - "${GITLY_HTTP_PORT:-58080}:8080"
    volumes:
      - coil-gitly-appdata:/app/.coil
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: coil
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: coil_gitly
    ports:
      - "${GITLY_POSTGRES_PORT:-15432}:5432"
    volumes:
      - coil-gitly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coil -d coil_gitly"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "${GITLY_REDIS_PORT:-16379}:6379"
    volumes:
      - coil-gitly-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "${GITLY_MINIO_PORT:-9000}:9000"
      - "${GITLY_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - coil-gitly-minio:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minio minio123; do
          sleep 1
        done
        mc mb --ignore-existing local/gitly
        mc anonymous set download local/gitly
    restart: "no"

volumes:
  coil-gitly-appdata:
  coil-gitly-postgres:
  coil-gitly-redis:
  coil-gitly-minio:
