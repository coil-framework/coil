[package]
name = "coil-cache"
version = "0.1.1"
edition = "2024"

rust-version = "1.85"
license = "MIT"
repository = "https://github.com/coil-framework/coil"
homepage = "https://coil.rs"
documentation = "https://coil.rs/docs"
description = "Caching primitives for the Coil framework."
readme = "README.md"
[dependencies]
bincode = "1.3"
redis = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
