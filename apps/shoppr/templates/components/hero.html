<section class="hero" xmlns:coil="https://coil.rs" coil:fragment="hero">
  <div class="hero-content">
    <p class="hero-eyebrow" coil:text="${site.display_name}">Seasonal storefront</p>
    <h1 coil:text="${page.title}">Move from featured collections to checkout without leaving the public flow.</h1>
    <p>
      This site is part of the Shoppr multi-market demo: one customer workspace, one brand family,
      and a site-specific assortment, locale policy, and merchandising path.
    </p>
    <div class="checkout-actions">
      <a class="button" href="/shop" coil:attr="href=${links.catalog}">Shop the catalog</a>
      <a class="button button--secondary" href="/shop/collections" coil:attr="href=${links.collections}">
        Browse collections
      </a>
    </div>
  </div>
</section>
