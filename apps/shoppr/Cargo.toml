[workspace]
resolver = "3"
members = [
    "crates/shoppr-app",
    "crates/shoppr-backend",
    "crates/shoppr-bin",
    "backend/shoppr-loyalty-backend",
]
default-members = ["crates/shoppr-bin"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.7", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
coil-admin = { version = "0.1.1", path = "../../crates/coil-admin" }
coil = { package = "coil-rs", version = "0.1.1", path = "../../crates/coil", default-features = false }
coil-app = { version = "0.1.1", path = "../../crates/coil-app" }
coil-assets = { version = "0.1.1", path = "../../crates/coil-assets" }
coil-auth = { version = "0.1.1", path = "../../crates/coil-auth" }
coil-cms = { version = "0.1.1", path = "../../crates/coil-cms" }
coil-commerce = { version = "0.1.1", path = "../../crates/coil-commerce" }
coil-config = { version = "0.1.1", path = "../../crates/coil-config" }
coil-core = { version = "0.1.1", path = "../../crates/coil-core" }
coil-customer-sdk = { version = "0.1.1", path = "../../crates/coil-customer-sdk" }
coil-data = { version = "0.1.1", path = "../../crates/coil-data" }
coil-events = { version = "0.1.1", path = "../../crates/coil-events" }
coil-media = { version = "0.1.1", path = "../../crates/coil-media" }
coil-memberships = { version = "0.1.1", path = "../../crates/coil-memberships" }
coil-ops = { version = "0.1.1", path = "../../crates/coil-ops" }
coil-runtime = { version = "0.1.1", path = "../../crates/coil-runtime" }
coil-seo = { version = "0.1.1", path = "../../crates/coil-seo" }
coil-template = { version = "0.1.1", path = "../../crates/coil-template" }
coil-tls = { version = "0.1.1", path = "../../crates/coil-tls" }
