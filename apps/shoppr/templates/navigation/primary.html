<nav class="primary-nav" xmlns:coil="https://coil.rs" coil:fragment="primary">
  <div class="primary-nav__links">
    <a
      class="primary-nav__link"
      href="/"
      coil:each="item : ${navigation.primary}"
      coil:attr="href=${item.href}"
      coil:text="${item.label}"
    >
      Navigation item
    </a>
  </div>
  <div class="primary-nav__actions">
    <button
      class="primary-nav__button"
      type="button"
      data-panel-toggle="market-panel"
      aria-expanded="false"
      aria-controls="market-panel"
      coil:t="nav.market"
    >
      Market
    </button>
    <button
      class="primary-nav__button"
      type="button"
      data-panel-toggle="locale-panel"
      aria-expanded="false"
      aria-controls="locale-panel"
      coil:t="nav.language"
    >
      Language
    </button>
  </div>
</nav>
