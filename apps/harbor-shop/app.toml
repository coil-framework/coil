[app]
name = "harbor-shop"
display_name = "Harbor Shop"

[domains]
canonical = "shop.example.com"
additional = ["www.example.com"]

[i18n]
default_locale = "en-GB"
supported_locales = ["en-GB", "fr-FR"]

[theme]
active = "harbor"
template_namespaces = ["customer-app", "harbor"]
asset_roots = ["theme/assets"]

[auth]
mode = "extend"
package = "harbor-auth"

[modules]
enabled = ["cms", "media", "commerce", "commerce-payments-stripe", "memberships", "events", "admin", "ops"]

[[extensions]]
id = "harbor-waitlist-tools"
package_version = "0.1.0"
artifact_sha256 = "a86d1a1646e818bf600653ba6cf3585162157517acf74d76c20ecba3328694dc"
customer_app_id = "harbor-shop"

[[extensions.handlers]]
id = "home.waitlist.banner"
grants = []
