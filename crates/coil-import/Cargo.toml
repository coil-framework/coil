[package]
name = "coil-import"
version = "0.1.1"
edition = "2024"

rust-version = "1.85"
license = "MIT"
repository = "https://github.com/coil-framework/coil"
homepage = "https://coil.rs"
documentation = "https://coil.rs/docs"
description = "Content and catalogue import support for the Coil framework."
readme = "README.md"
[dependencies]
coil-report = { version = "0.1.1", path = "../coil-report" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.17"
toml = "0.8"
