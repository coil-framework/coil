name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      FISSION_REV: 9e2e3139e48afd05e23fa92d65be82e531772cea
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Fission base
        run: |
          mkdir -p "$RUNNER_WORKSPACE/../fission"
          git clone --filter=blob:none --branch gaming --single-branch https://github.com/fission-ui/fission.git "$RUNNER_WORKSPACE/../fission/fission"
          git -C "$RUNNER_WORKSPACE/../fission/fission" checkout "$FISSION_REV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test core workspace
        run: cargo test --workspace
      - name: Prepare Shoppr local overrides
        run: ./scripts/prepare-local-dev.sh
        working-directory: apps/shoppr
      - name: Test Shoppr workspace
        run: cargo test --workspace
        working-directory: apps/shoppr
      - name: Prepare Gitly local overrides
        run: ./scripts/prepare-local-dev.sh
        working-directory: apps/gitly
      - name: Test Gitly workspace
        run: cargo test --workspace
        working-directory: apps/gitly

  docs:
    runs-on: ubuntu-latest
    env:
      FISSION_REV: 9e2e3139e48afd05e23fa92d65be82e531772cea
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Fission base
        run: |
          mkdir -p "$RUNNER_WORKSPACE/../fission"
          git clone --filter=blob:none --branch gaming --single-branch https://github.com/fission-ui/fission.git "$RUNNER_WORKSPACE/../fission/fission"
          git -C "$RUNNER_WORKSPACE/../fission/fission" checkout "$FISSION_REV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build docs
        run: cargo run -p coil-website -- build --project-dir website
