name: Docs

on:
  push:
    branches: ["main"]
    paths:
      - "website/**"
      - "docs/**"
      - "docs/design/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "README.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "ROADMAP.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FISSION_REV: 9e2e3139e48afd05e23fa92d65be82e531772cea
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Fission base
        run: |
          mkdir -p "$RUNNER_WORKSPACE/../fission"
          git clone --filter=blob:none --branch gaming --single-branch https://github.com/fission-ui/fission.git "$RUNNER_WORKSPACE/../fission/fission"
          git -C "$RUNNER_WORKSPACE/../fission/fission" checkout "$FISSION_REV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/configure-pages@v5
      - name: Build site
        run: cargo run -p coil-website -- build --project-dir website
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
