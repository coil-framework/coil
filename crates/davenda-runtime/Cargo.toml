[package]
name = "davenda-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
davenda-auth = { path = "../davenda-auth" }
davenda-assets = { path = "../davenda-assets" }
davenda-cache = { path = "../davenda-cache" }
davenda-config = { path = "../davenda-config" }
davenda-core = { path = "../davenda-core" }
davenda-data = { path = "../davenda-data" }
davenda-i18n = { path = "../davenda-i18n" }
davenda-jobs = { path = "../davenda-jobs" }
davenda-observability = { path = "../davenda-observability" }
davenda-ops = { path = "../davenda-ops" }
davenda-seo = { path = "../davenda-seo" }
davenda-storage = { path = "../davenda-storage" }
davenda-template = { path = "../davenda-template" }
davenda-tls = { path = "../davenda-tls" }
davenda-wasm = { path = "../davenda-wasm" }
ipnet = "2"
rusqlite = { version = "0.30", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
ureq = { version = "2.12", default-features = false, features = ["tls"] }
zanzibar = { workspace = true }

[dev-dependencies]
async-trait = "0.1"
davenda-admin = { path = "../davenda-admin" }
davenda-commerce = { path = "../davenda-commerce" }
davenda-cms = { path = "../davenda-cms" }
davenda-events = { path = "../davenda-events" }
davenda-media = { path = "../davenda-media" }
davenda-memberships = { path = "../davenda-memberships" }
davenda-observability = { path = "../davenda-observability" }
wat = "1"
