[workspace]
resolver = "3"
members = [
    "crates/cargo-coil",
    "crates/coil-a11y",
    "crates/coil-app",
    "crates/coil-admin",
    "crates/coil",
    "crates/coil-assets",
    "crates/coil-auth",
    "crates/coil-cache",
    "crates/coil-cms",
    "crates/coil-cli",
    "crates/coil-commerce",
    "crates/coil-config",
    "crates/coil-core",
    "crates/coil-customer-sdk",
    "crates/coil-data",
    "crates/coil-events",
    "crates/coil-i18n",
    "crates/coil-import",
    "crates/coil-jobs",
    "crates/coil-media",
    "crates/coil-memberships",
    "crates/coil-observability",
    "crates/coil-ops",
    "crates/coil-report",
    "crates/coil-runtime",
    "crates/coil-seo",
    "crates/coil-scaffold",
    "crates/coil-storage",
    "crates/coil-template",
    "crates/coil-tls",
    "crates/coil-wasm",
]
exclude = ["third_party/zanzibar"]

[workspace.package]
edition = "2024"
version = "0.1.1"
rust-version = "1.85"

[workspace.dependencies]
zanzibar = "0.1.0"
