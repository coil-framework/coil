services:
  app:
    build:
      context: ../..
      dockerfile: apps/harbor-shop/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      DAVENDA_CONFIG: platform.dev.toml
      DATABASE_URL: postgres://davenda:devpass@postgres:5438/davenda_harbor_shop
      REDIS_URL: redis://redis:6379
      DAVENDA_COOKIE_SECRET: "01234567012345670123456701234567"
      DAVENDA_CSRF_SECRET: "76543210765432107654321076543210"
      STRIPE_PUBLISHABLE_KEY: "${STRIPE_PUBLISHABLE_KEY:-pk_test_replace_me}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-sk_test_replace_me}"
      STRIPE_WEBHOOK_SECRET: replace-me
      OBJECT_STORE_URL: |-
        endpoint_url="http://minio:9000"
        bucket="harbor-shop"
        region="us-east-1"
        access_key_id="minio"
        secret_access_key="minio123"
    ports:
      - "8080:8080"
    volumes:
      - harbor-shop-appdata:/app/apps/harbor-shop/.davenda
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: davenda
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: davenda_harbor_shop
    ports:
      - "5438:5432"
    volumes:
      - harbor-shop-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U davenda -d davenda_harbor_shop"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - harbor-shop-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - harbor-shop-minio:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 minio minio123; do
          sleep 1
        done
        mc mb --ignore-existing local/harbor-shop
        mc anonymous set download local/harbor-shop
    restart: "no"

volumes:
  harbor-shop-appdata:
  harbor-shop-postgres:
  harbor-shop-redis:
  harbor-shop-minio:
