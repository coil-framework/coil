<!doctype html>
<html
  xmlns:dv="https://davenda.dev"
  dv:with="pageTitle='Order confirmed'"
  lang="en-GB"
  dv:attr="lang=${locale}"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title dv:text="${page.title}">Order confirmed</title>
    <link rel="stylesheet" href="/theme/assets/site.css" dv:href="@{theme/assets/site.css}" />
  </head>
  <body class="harbor">
    <header class="site-header">
      <a href="/" class="brand">Harbor Shop</a>
      <nav dv:replace="~{navigation/primary}"></nav>
    </header>
    <main class="site-main account-page">
      <section class="account-page__intro">
        <p class="account-page__eyebrow">Confirmation</p>
        <h1>Order received</h1>
        <p class="checkout-confirmation__order">
          Reference <strong dv:text="${confirmation.orderNumber}">HS-10482</strong>
        </p>
        <p dv:text="${confirmation.nextStep}">
          A confirmation email and membership activation will follow shortly.
        </p>
        <ul class="checkout-summary checkout-summary--stacked" dv:if="${confirmation.lineItems}">
          <li dv:each="item : ${confirmation.lineItems}">
            <span dv:text="${item.title}">Harbor pantry set</span>
            <span dv:text="${item.quantity}">1</span>
            <strong dv:text="${item.total}">GBP 48</strong>
          </li>
        </ul>
        <div class="checkout-actions">
          <a class="button" href="/account">View account</a>
          <a class="button button--secondary" href="/shop">Continue shopping</a>
        </div>
      </section>
      <div dv:replace="~{account/summary-panels :: panels}"></div>
    </main>
    <footer class="site-footer">
      <small>Harbor Shop</small>
    </footer>
  </body>
</html>
