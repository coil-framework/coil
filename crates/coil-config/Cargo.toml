[package]
name = "coil-config"
version = "0.1.0"
edition = "2024"

rust-version = "1.85"
license = "MIT"
repository = "https://github.com/coil-framework/coil"
homepage = "https://coil-framework.github.io/coil/"
documentation = "https://coil-framework.github.io/coil/"
description = "Configuration models and loaders for the Coil framework."
[dependencies]
ipnet = "2"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"
toml = "0.8"
url = { version = "2", features = ["serde"] }
