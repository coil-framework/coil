[package]
name = "shoppr-loyalty-backend"
version = "0.1.0"
edition = "2024"
publish = false
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", features = ["json"] }
davenda-customer-sdk.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
