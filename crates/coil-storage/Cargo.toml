[package]
name = "coil-storage"
version = "0.1.1"
edition = "2024"

rust-version = "1.85"
license = "MIT"
repository = "https://github.com/coil-framework/coil"
homepage = "https://coil.rs"
documentation = "https://coil.rs/docs"
description = "Object storage primitives for the Coil framework."
readme = "README.md"
[dependencies]
coil-config = { version = "0.1.1", path = "../coil-config" }
bytes = "1"
futures = "0.3"
object_store = { version = "0.13.2", default-features = false, features = ["aws"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
thiserror = "1.0"
toml = "0.8"
url = "2"
