[package]
name = "coil-jobs"
version = "0.1.0"
edition = "2024"

rust-version = "1.85"
license = "MIT"
repository = "https://github.com/coil-framework/coil"
homepage = "https://coil-framework.github.io/coil/"
documentation = "https://coil-framework.github.io/coil/"
description = "Background job and scheduler primitives for the Coil framework."
[dependencies]
coil-config = { version = "0.1.0", path = "../coil-config" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
