[package]
name = "coil-auth"
version = "0.1.0"
edition = "2024"

rust-version = "1.85"
license = "MIT"
repository = "https://github.com/coil-framework/coil"
homepage = "https://coil.rs"
documentation = "https://coil.rs/docs"
description = "Authorisation models and auth package support for the Coil framework."
readme = "README.md"
[dependencies]
coil-config = { version = "0.1.0", path = "../coil-config" }
coil-data = { version = "0.1.0", path = "../coil-data" }
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
zanzibar = { workspace = true }
