<section class="hero" xmlns:dv="https://davenda.dev" dv:fragment="hero">
  <div class="hero-content">
    <p class="hero-eyebrow" dv:text="${site.displayName}">Seasonal storefront</p>
    <h1 dv:text="${page.title}">Move from featured collections to checkout without leaving the public flow.</h1>
    <p>
      This site is part of the Harbor multi-site demo: one customer workspace, one brand family,
      and a site-specific assortment, locale policy, and merchandising path.
    </p>
    <div class="checkout-actions">
      <a class="button" href="/en-GB/shop" dv:attr="href=${links.catalog}">Shop the catalog</a>
      <a class="button button--secondary" href="/en-GB/shop/collections" dv:attr="href=${links.collections}">
        Browse collections
      </a>
    </div>
  </div>
</section>
