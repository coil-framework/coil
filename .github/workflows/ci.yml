name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test core workspace
        run: cargo test --workspace
      - name: Prepare Shoppr local overrides
        run: ./scripts/prepare-local-dev.sh
        working-directory: apps/shoppr
      - name: Test Shoppr workspace
        run: cargo test --workspace
        working-directory: apps/shoppr
      - name: Prepare Gitly local overrides
        run: ./scripts/prepare-local-dev.sh
        working-directory: apps/gitly
      - name: Test Gitly workspace
        run: cargo test --workspace
        working-directory: apps/gitly

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install docs dependencies
        run: npm ci
        working-directory: website
      - name: Build docs
        run: npm run build
        working-directory: website
