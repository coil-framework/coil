[app]
name = "octohub"
environment = "production"

[server]
bind = "0.0.0.0:8080"
trusted_proxies = ["10.0.0.0/8"]

[http.session]
store = "redis"
idle_timeout_secs = 3600
absolute_timeout_secs = 86400

[http.session_cookie]
name = "davenda_session"
path = "/"
same_site = "lax"
secure = true
http_only = true

[http.flash_cookie]
name = "davenda_flash"
path = "/"
same_site = "lax"
secure = true
http_only = true

[http.csrf]
enabled = true
field_name = "_csrf"
header_name = "x-csrf-token"

[tls]
mode = "acme"
challenge = "dns-01"
provider = "cloudflare-dns"

[database]
url = { kind = "env", var = "DATABASE_URL" }
schema = "public"
migrations_table = "_davenda_migrations"
min_connections = 4
max_connections = 32
statement_timeout_secs = 30

[storage]
default_class = "public_upload"
deployment = "distributed"
object_store = "s3"
object_store_secret = { kind = "env", var = "OBJECT_STORE_URL" }
local_root = "/var/lib/davenda/octohub"

[cache]
l1 = "moka"
l2 = "redis"

[i18n]
default_locale = "en-GB"
supported_locales = ["en-GB", "fr-FR", "de-DE"]
fallback_locale = "en-GB"
localized_routes = false

[seo]
canonical_host = "octohub.example.com"
emit_json_ld = true

[[sites]]
id = "default"
display_name = "OctoHub"
brand_name = "OctoHub"
canonical_host = "octohub.example.com"
hosts = ["octohub.127.0.0.1.nip.io", "www.example.com"]
default_locale = "en-GB"
supported_locales = ["en-GB", "fr-FR", "de-DE"]

[auth]
package = "octohub-auth"
explain_api = false
tenant_id = 202

[modules]
enabled = ["admin", "cms", "media", "octohub-showcase"]

[wasm]
directory = "apps/octohub/extensions"
default_time_limit_ms = 50
allow_network = false

[jobs]
backend = "redis"

[observability]
metrics = true
tracing = true

[assets]
publish_manifest = true
cdn_base_url = "https://cdn.example.com"
