<header class="site-header" xmlns:coil="https://coil.rs" coil:fragment="header">
  <div class="site-header__utility">
    <p coil:t="home.utility.summary">Complimentary delivery on all orders over £150.</p>
    <div class="site-header__utility-links">
      <a href="/__dev" coil:t="shell.utility.dev_tools">Dev Tools</a>
      <a href="/admin" coil:t="shell.utility.admin">Admin</a>
      <a href="/account" coil:t="shell.utility.account">Account</a>
    </div>
  </div>
  <div class="site-header__main">
    <a href="/" class="brand" coil:attr="href=${links.home}">
      <span class="brand__mark">S</span>
      <span class="brand__wordmark" coil:text="${site.brand_name}">Shoppr Townhouse</span>
    </a>
    <nav coil:replace="~{navigation/primary}"></nav>
  </div>
  <div class="site-header__panels">
    <div class="switcher-panel" id="market-panel" hidden="hidden">
      <p class="switcher-panel__eyebrow" coil:t="nav.market">Market</p>
      <ul>
        <li coil:each="item : ${links.site_switches}">
          <a href="/" coil:attr="href=${item.href}" coil:text="${item.label}">Shoppr UK</a>
          <span coil:if="${item.active}" coil:t="nav.current">Current</span>
        </li>
      </ul>
    </div>
    <div class="switcher-panel" id="locale-panel" hidden="hidden">
      <p class="switcher-panel__eyebrow" coil:t="nav.language">Language</p>
      <ul>
        <li coil:each="item : ${links.locale_switches}">
          <a href="/" coil:attr="href=${item.href}" coil:text="${item.label}">English</a>
          <span coil:if="${item.active}" coil:t="nav.current">Current</span>
        </li>
      </ul>
    </div>
  </div>
</header>
