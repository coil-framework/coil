<!doctype html>
<html
  xmlns:dv="https://davenda.dev"
  dv:with="pageTitle='Cart'"
  lang="en-GB"
  dv:attr="lang=${locale}"
>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title dv:text="${page.title}">Cart</title>
    <link rel="stylesheet" href="/theme/assets/site.css" dv:href="@{theme/assets/site.css}" />
  </head>
  <body class="harbor">
    <header class="site-header">
      <a href="/" class="brand">Harbor Shop</a>
      <nav dv:replace="~{navigation/primary}"></nav>
    </header>
    <main class="site-main cart-page">
      <section class="cart-page__intro">
        <p class="cart-page__eyebrow">Cart</p>
        <h1>Review the basket before moving to payment.</h1>
      </section>
      <div class="cart-page__grid">
        <section class="cart-card">
          <h2>Items</h2>
          <form class="commerce-form cart-update-form" action="/cart" method="post">
            <input type="hidden" name="cart_action" value="update" />
            <ul class="cart-lines">
              <li class="cart-line" dv:each="item : ${cartItems}">
                <div>
                  <strong dv:text="${item.title}">Harbor Cap</strong>
                  <p dv:text="${item.variant}">Canvas cap</p>
                </div>
                <label class="commerce-form__field commerce-form__field--compact">
                  <span>Qty</span>
                  <input
                    type="number"
                    name="quantity"
                    min="0"
                    value="1"
                    dv:attr="name=${item.quantityField},value=${item.quantity}"
                  />
                </label>
                <strong dv:text="${item.total}">GBP 29</strong>
              </li>
            </ul>
            <div class="cart-page__actions">
              <button class="button button--secondary" type="submit">Update cart</button>
            </div>
          </form>
        </section>
        <aside class="cart-card">
          <h2>Summary</h2>
          <p><span>Subtotal</span><strong dv:text="${cartSummary.subtotal}">GBP 118</strong></p>
          <p><span>Delivery</span><strong dv:text="${cartSummary.shipping}">GBP 0</strong></p>
          <p><span>Total</span><strong dv:text="${cartSummary.total}">GBP 118</strong></p>
          <div class="cart-page__actions">
            <form class="commerce-form commerce-form--inline" action="/checkout/start" method="post">
              <input type="hidden" name="cart_intent" value="reviewed" />
              <button class="button" type="submit">Checkout</button>
            </form>
            <a class="button" href="/en-GB/shop" dv:attr="href=${links.catalog}">
              Continue shopping
            </a>
          </div>
        </aside>
      </div>
    </main>
    <footer class="site-footer">
      <small>Harbor Shop</small>
    </footer>
  </body>
</html>
