<!doctype html>
<html lang="{{ locale }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ asset \"theme/assets/site.css\" }}" />
  </head>
  <body class="harbor">
    <header class="site-header">
      <a href="/" class="brand">Harbor Shop</a>
      {{ fragment "navigation.primary" }}
    </header>
    <main class="site-main">
      {{ slot "content" }}
    </main>
    <footer class="site-footer">
      <small>Harbor Shop</small>
    </footer>
  </body>
</html>
