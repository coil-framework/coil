[package]
name = "coil-jobs"
version = "0.1.0"
edition = "2024"

[dependencies]
coil-config = { path = "../coil-config" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", default-features = false, features = ["postgres", "runtime-tokio-rustls"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
