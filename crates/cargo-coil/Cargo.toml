[package]
name = "cargo-coil"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/coil-framework/coil"
homepage = "https://coil.rs"
documentation = "https://coil.rs/docs"
description = "Cargo subcommand for creating and evolving Coil customer projects."
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
coil-scaffold = { version = "0.1.2", path = "../coil-scaffold" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }

[[bin]]
name = "cargo-coil"
path = "src/main.rs"
