[package]
name = "coil-tls"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
coil-data = { path = "../coil-data" }
coil-config = { path = "../coil-config" }
lers = { version = "0.4.0", default-features = false, features = ["http-01", "dns-01-cloudflare", "tls-alpn-01"] }
openssl = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls"] }
thiserror = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
